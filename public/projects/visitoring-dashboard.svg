  <text x="132" y="217" fill="#7d9188" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">WORKSPACE</text>
  <rect x="119" y="235" width="210" height="48" rx="12" fill="#dcece4" />
  <circle cx="143" cy="259" r="6" fill="#28795f" />
  <text x="161" y="265" fill="#1c5b48" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650">Overview</text>
  <circle cx="143" cy="316" r="5" fill="#9baca4" />
  <text x="161" y="322" fill="#536b61" font-family="Inter, Arial, sans-serif" font-size="16">Pages</text>
  <circle cx="143" cy="370" r="5" fill="#9baca4" />
  <text x="161" y="376" fill="#536b61" font-family="Inter, Arial, sans-serif" font-size="16">Events</text>
  <circle cx="143" cy="424" r="5" fill="#9baca4" />
  <text x="161" y="430" fill="#536b61" font-family="Inter, Arial, sans-serif" font-size="16">Traffic sources</text>
  <circle cx="143" cy="478" r="5" fill="#9baca4" />
  <text x="161" y="484" fill="#536b61" font-family="Inter, Arial, sans-serif" font-size="16">Settings</text>
  <rect x="120" y="730" width="208" height="49" rx="13" fill="#e1eee8" />
  <circle cx="145" cy="754" r="7" fill="#28795f" />
  <text x="163" y="751" fill="#335d4e" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">PRIVACY BY DESIGN</text>
  <text x="163" y="769" fill="#71857b" font-family="Inter, Arial, sans-serif" font-size="12">No cookies. No stored IPs.</text>

  <text x="397" y="145" fill="#78877f" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Visitoring  /  Overview</text>
  <text x="397" y="196" fill="#17372f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Marketing site</text>
  <text x="397" y="222" fill="#718079" font-family="Inter, Arial, sans-serif" font-size="15">A clear read on what brings people in and what they do next.</text>
  <rect x="1280" y="127" width="174" height="43" rx="12" fill="#f0f5f2" stroke="#dce6e0" />
  <text x="1300" y="154" fill="#536b60" font-family="Inter, Arial, sans-serif" font-size="14">Last 7 days</text>
  <path d="m1427 145 6 6 6-6" fill="none" stroke="#7a8e84" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
  <rect x="1380" y="183" width="74" height="25" rx="12" fill="#fff0dd" />
  <text x="1393" y="200" fill="#a76525" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8">SAMPLE DATA</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="397" y="248" width="333" height="128" rx="15" fill="#fff" stroke="#e2eae5" />
    <text x="419" y="279" fill="#78877f" font-size="14">Page views</text>
    <text x="419" y="331" fill="#17372f" font-size="34" font-weight="700">12,480</text>
    <text x="634" y="330" fill="#328566" font-size="14" font-weight="700">↗ 18.4%</text>
    <text x="419" y="356" fill="#a0aaa4" font-size="12">compared with previous period</text>

    <rect x="748" y="248" width="333" height="128" rx="15" fill="#fff" stroke="#e2eae5" />
    <text x="770" y="279" fill="#78877f" font-size="14">Visitors</text>
    <text x="770" y="331" fill="#17372f" font-size="34" font-weight="700">4,210</text>
    <text x="963" y="330" fill="#328566" font-size="14" font-weight="700">↗ 12.6%</text>
    <text x="770" y="356" fill="#a0aaa4" font-size="12">compared with previous period</text>

    <rect x="1099" y="248" width="355" height="128" rx="15" fill="#eaf4ee" stroke="#d9e9df" />
    <text x="1122" y="279" fill="#718079" font-size="14">Collection choices</text>
    <text x="1122" y="317" fill="#1b624b" font-size="20" font-weight="700">Only the useful bits.</text>
    <text x="1122" y="347" fill="#58766a" font-size="13">Broad trends, with less personal data.</text>
  </g>

  <rect x="397" y="402" width="704" height="331" rx="16" fill="#fff" stroke="#e2eae5" />
  <text x="422" y="440" fill="#17372f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Activity over time</text>
  <text x="422" y="465" fill="#8a9991" font-family="Inter, Arial, sans-serif" font-size="13">Page views across the selected period</text>
