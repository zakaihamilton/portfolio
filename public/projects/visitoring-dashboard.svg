  <path d="M447 607 528 574 610 591 692 527 774 548 856 498 938 529 1022 478" fill="none" stroke="#348466" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
  <path d="M447 607 528 574 610 591 692 527 774 548 856 498 938 529 1022 478 1022 668 447 668Z" fill="#dcefe5" opacity=".72" />
  <path d="M447 607 528 574 610 591 692 527 774 548 856 498 938 529 1022 478" fill="none" stroke="#348466" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
