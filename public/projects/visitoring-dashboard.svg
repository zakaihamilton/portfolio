    <circle cx="447" cy="607" r="5"/><circle cx="528" cy="574" r="5"/><circle cx="610" cy="591" r="5"/><circle cx="692" cy="527" r="5"/>
    <circle cx="774" cy="548" r="5"/><circle cx="856" cy="498" r="5"/><circle cx="938" cy="529" r="5"/><circle cx="1022" cy="478" r="5"/>
  </g>
  <g fill="#8a9991" font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="443" y="697">Mon</text><text x="525" y="697">Tue</text><text x="607" y="697">Wed</text><text x="689" y="697">Thu</text>
    <text x="771" y="697">Fri</text><text x="853" y="697">Sat</text><text x="935" y="697">Sun</text><text x="1014" y="697">Today</text>
  </g>

  <rect x="1119" y="402" width="335" height="331" rx="16" fill="#fff" stroke="#e2eae5" />
  <text x="1144" y="440" fill="#17372f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Traffic sources</text>
  <text x="1144" y="465" fill="#8a9991" font-family="Inter, Arial, sans-serif" font-size="13">Where visits came from</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14">
    <text x="1144" y="516" fill="#536b60">Direct</text><rect x="1144" y="529" width="258" height="9" rx="4.5" fill="#edf2ef"/><rect x="1144" y="529" width="190" height="9" rx="4.5" fill="#348466"/>
    <text x="1144" y="574" fill="#536b60">Search</text><rect x="1144" y="587" width="258" height="9" rx="4.5" fill="#edf2ef"/><rect x="1144" y="587" width="147" height="9" rx="4.5" fill="#65a78d"/>
    <text x="1144" y="632" fill="#536b60">Referrals</text><rect x="1144" y="645" width="258" height="9" rx="4.5" fill="#edf2ef"/><rect x="1144" y="645" width="94" height="9" rx="4.5" fill="#a9cdb8"/>
  </g>
  <path d="M397 760h1057" stroke="#e3eae5" />
  <circle cx="414" cy="784" r="5" fill="#328566" />
  <text x="428" y="789" fill="#72837a" font-family="Inter, Arial, sans-serif" font-size="13">Sample project · private analytics for the sites you run</text>
