<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Visitoring analytics dashboard</title>
  <desc id="description">A sample analytics dashboard with page views, visitors, activity over time, traffic sources, and privacy indicators.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#153b35" />
      <stop offset="1" stop-color="#0d2424" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071817" flood-opacity=".25" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#e9f0ec" />
  <rect x="55" y="52" width="1490" height="796" rx="28" fill="url(#backdrop)" />
  <rect x="96" y="92" width="1408" height="716" rx="18" fill="#f8faf8" filter="url(#shadow)" />
  <path d="M354 92h1132a18 18 0 0 1 18 18v680a18 18 0 0 1-18 18H354z" fill="#f8faf8" />
  <path d="M114 92h240v716H114a18 18 0 0 1-18-18V110a18 18 0 0 1 18-18" fill="#eef4f0" />
  <path d="M354 92v716" stroke="#dfe9e3" />

  <rect x="132" y="126" width="34" height="34" rx="11" fill="#28795f" />
