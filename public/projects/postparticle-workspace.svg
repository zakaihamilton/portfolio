<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">PostParticle publishing workspace</title>
  <desc id="description">An illustrative editorial workspace with a private article draft, publishing snapshot controls, revision history, and private media settings.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6eee0" />
      <stop offset="1" stop-color="#e7dbc7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3a2f21" flood-opacity=".17" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)" />
  <rect x="58" y="48" width="1484" height="804" rx="25" fill="#fffdf9" filter="url(#shadow)" />
  <path d="M58 122h1484" stroke="#eee7dc" />
  <rect x="90" y="73" width="36" height="36" rx="12" fill="#7346a9" />
  <path d="M99 98V84h6l5 7 5-7h6v14" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
  <text x="140" y="98" fill="#34253f" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">PostParticle</text>
  <text x="352" y="97" fill="#8b7c6b" font-family="Inter, Arial, sans-serif" font-size="14">Content studio</text>
  <rect x="1190" y="67" width="116" height="42" rx="11" fill="#f5f0e8" stroke="#e6ddd0" />
  <text x="1219" y="93" fill="#675b4c" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Preview</text>
  <rect x="1318" y="67" width="192" height="42" rx="11" fill="#7346a9" />
  <text x="1341" y="93" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Publish snapshot</text>

  <path d="M58 122h236v730H83a25 25 0 0 1-25-25z" fill="#f8f4ed" />
  <path d="M294 122v730" stroke="#eee7dc" />
  <text x="91" y="164" fill="#9a8c7a" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">WORKSPACE</text>
  <rect x="77" y="181" width="198" height="46" rx="11" fill="#eee6f7" />
  <path d="M99 197h14m-14 7h14m-14 7h9" stroke="#7346a9" stroke-linecap="round" stroke-width="2" />
  <text x="126" y="210" fill="#55327d" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Articles</text>
  <circle cx="105" cy="256" r="7" fill="none" stroke="#978a78" stroke-width="1.8" />
  <path d="M101 256h8M105 252v8" stroke="#978a78" stroke-linecap="round" stroke-width="1.5" />
  <text x="126" y="261" fill="#655b4f" font-family="Inter, Arial, sans-serif" font-size="14">Media library</text>
  <rect x="99" y="291" width="13" height="14" rx="2" fill="none" stroke="#978a78" stroke-width="1.7" />
  <path d="M102 295h7m-7 4h7" stroke="#978a78" stroke-linecap="round" stroke-width="1.4" />
  <text x="126" y="303" fill="#655b4f" font-family="Inter, Arial, sans-serif" font-size="14">JSON documents</text>
  <path d="M102 345a7 7 0 1 0 0 .1" fill="none" stroke="#978a78" stroke-width="1.7" />
  <path d="M102 341v5l3 2" fill="none" stroke="#978a78" stroke-linecap="round" stroke-width="1.5" />
  <text x="126" y="350" fill="#655b4f" font-family="Inter, Arial, sans-serif" font-size="14">Revisions</text>
  <rect x="77" y="756" width="198" height="66" rx="13" fill="#f0eadf" />
  <text x="94" y="782" fill="#655b4f" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650">Storage</text>
  <text x="94" y="803" fill="#8b7c6b" font-family="Inter, Arial, sans-serif" font-size="12">S3-compatible content space</text>

  <text x="333" y="161" fill="#998c7c" font-family="Inter, Arial, sans-serif" font-size="13">Articles  /  New article</text>
  <rect x="333" y="183" width="92" height="29" rx="14" fill="#f3ebdd" />
  <circle cx="350" cy="197" r="4" fill="#c07b35" />
  <text x="361" y="202" fill="#8b5928" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">PRIVATE DRAFT</text>
  <text x="333" y="272" fill="#302b24" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">A useful idea, clearly told</text>
  <text x="333" y="309" fill="#8e8272" font-family="Inter, Arial, sans-serif" font-size="14">Markdown article · changes stay private until you publish</text>
  <path d="M333 342h560" stroke="#e8e0d4" />
  <g fill="#817668" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650">
    <text x="342" y="374">H1</text><text x="389" y="374">B</text><text x="423" y="374">I</text><text x="457" y="374">Link</text><text x="511" y="374">List</text><text x="563" y="374">Quote</text>
  </g>
  <path d="M333 389h560" stroke="#e8e0d4" />
  <text x="333" y="438" fill="#51483d" font-family="Georgia, 'Times New Roman', serif" font-size="22">The best publishing tools make room for the writing.</text>
  <text x="333" y="480" fill="#82786d" font-family="Inter, Arial, sans-serif" font-size="15">Shape the story here, then decide when it is ready for the world.</text>
  <text x="333" y="516" fill="#82786d" font-family="Inter, Arial, sans-serif" font-size="15">A draft can keep changing while the public version stays steady.</text>
  <rect x="333" y="553" width="558" height="122" rx="14" fill="#f7f2ea" />
  <rect x="355" y="575" width="93" height="78" rx="10" fill="#e7dccb" />
  <path d="m374 636 20-23 13 13 12-16 13 26" fill="none" stroke="#b08b62" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
  <circle cx="421" cy="590" r="5" fill="#c28e55" />
  <text x="468" y="600" fill="#51483d" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Cover image</text>
  <text x="468" y="624" fill="#82786d" font-family="Inter, Arial, sans-serif" font-size="13">Private original · public delivery copy</text>
  <text x="468" y="647" fill="#7346a9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="650">Choose from media library</text>

  <rect x="923" y="145" width="270" height="665" rx="15" fill="#fbfaf7" stroke="#eee7dc" />
  <text x="947" y="183" fill="#342f28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Publishing</text>
  <rect x="947" y="201" width="222" height="73" rx="11" fill="#f2ece2" />
  <circle cx="966" cy="224" r="5" fill="#cb843c" />
  <text x="981" y="229" fill="#6f542f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">NOT PUBLISHED</text>
  <text x="964" y="251" fill="#6f6558" font-family="Inter, Arial, sans-serif" font-size="13">Draft edits are private.</text>
  <text x="947" y="317" fill="#342f28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Search appearance</text>
  <rect x="947" y="332" width="222" height="46" rx="9" fill="#fff" stroke="#e6dfd4" />
  <text x="961" y="360" fill="#746a5f" font-family="Inter, Arial, sans-serif" font-size="12">Page title and description</text>
  <rect x="947" y="389" width="222" height="46" rx="9" fill="#fff" stroke="#e6dfd4" />
  <text x="961" y="417" fill="#746a5f" font-family="Inter, Arial, sans-serif" font-size="12">Tags and article date</text>
  <path d="M947 461h222" stroke="#e7dfd3" />
  <text x="947" y="495" fill="#342f28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Revision history</text>
  <circle cx="956" cy="524" r="4" fill="#7346a9" />
  <text x="970" y="529" fill="#554c41" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Earlier versions are recoverable</text>
  <text x="947" y="559" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">Restore a previous revision if a change</text>
  <text x="947" y="578" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">needs to be rolled back.</text>
  <rect x="947" y="613" width="222" height="58" rx="11" fill="#eee6f7" />
  <path d="M966 634a7 7 0 1 0 0 .1" fill="none" stroke="#7346a9" stroke-width="1.8" />
  <path d="M966 630v5l4 2" fill="none" stroke="#7346a9" stroke-linecap="round" stroke-width="1.5" />
  <text x="986" y="639" fill="#55327d" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Draft and snapshot</text>
  <text x="986" y="657" fill="#76628a" font-family="Inter, Arial, sans-serif" font-size="11">Managed separately</text>

  <rect x="1210" y="145" width="290" height="665" rx="15" fill="#f8f4ed" stroke="#eee7dc" />
  <text x="1234" y="183" fill="#342f28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Content delivery</text>
  <text x="1234" y="210" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">A clean path from workspace to site.</text>
  <rect x="1234" y="239" width="242" height="121" rx="13" fill="#fffdf9" stroke="#e7dfd3" />
  <rect x="1252" y="257" width="34" height="34" rx="9" fill="#eee6f7" />
  <path d="M1261 265h16v18h-16zM1265 270h8m-8 5h8" fill="none" stroke="#7346a9" stroke-linecap="round" stroke-width="1.7" />
  <text x="1298" y="276" fill="#554c41" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Published snapshot</text>
  <text x="1252" y="318" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">Only published content reaches the API.</text>
  <rect x="1234" y="378" width="242" height="145" rx="13" fill="#fffdf9" stroke="#e7dfd3" />
  <text x="1252" y="407" fill="#554c41" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Media stays deliberate</text>
  <rect x="1252" y="424" width="206" height="37" rx="8" fill="#f5f0e8" />
  <circle cx="1268" cy="442" r="5" fill="#be7a36" />
  <text x="1282" y="447" fill="#665b4e" font-family="Inter, Arial, sans-serif" font-size="12">Original · private</text>
  <rect x="1252" y="470" width="206" height="37" rx="8" fill="#e9f1e9" />
  <circle cx="1268" cy="488" r="5" fill="#5a8c6c" />
  <text x="1282" y="493" fill="#4c725b" font-family="Inter, Arial, sans-serif" font-size="12">Delivery copy · public</text>
  <path d="M1234 548h242" stroke="#e2d9ca" />
  <text x="1234" y="584" fill="#342f28" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Typed Next.js client</text>
  <text x="1234" y="610" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">Fetch published content with a small</text>
  <text x="1234" y="629" fill="#897e70" font-family="Inter, Arial, sans-serif" font-size="12">typed integration and server rendering.</text>
  <rect x="1234" y="668" width="242" height="74" rx="12" fill="#30263a" />
  <text x="1254" y="698" fill="#e6d9f3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">content.fetch(&quot;articles&quot;)</text>
  <text x="1254" y="722" fill="#b9a8ca" font-family="Inter, Arial, sans-serif" font-size="11">Published content only</text>
</svg>
